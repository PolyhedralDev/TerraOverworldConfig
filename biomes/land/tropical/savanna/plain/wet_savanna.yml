id: WET_SAVANNA
type: BIOME
extends: SAVANNA
color: $biomes/colors.yml:WET_SAVANNA

vanilla: minecraft:savanna

attributes:
  terra:biome/grass_color: "#a8c778"
  terra:biome/foliage_color: "#87b55b"
  terra:biome/water_color: "#2c8b9c"
  minecraft:visual/water_fog_color: "#2c8b9c"

palette:
  - GRASS: $meta.yml:top-y
  - << meta.yml:palette-underwater
  - << meta.yml:palette-bottom

slant:
  - threshold: 0.8
    palette:
      - GRASS: $meta.yml:top-y
      - << meta.yml:palette-underwater
      - << meta.yml:palette-bottom
  - threshold: 0.4
    palette:
      - << meta.yml:palette-slant-generic
      - << meta.yml:palette-bottom

features:
  flora:
    - TALL_GRASS
    - DRY_GRASS
    - POPPY_PATCH
    - DANDELION_PATCH