id: SAVANNA
type: BIOME
extends:
  - ENVIRONMENT_LAND_TROPICAL_SAVANNA
  - EQ_LAND
  - CARVING_LAND
  - BASE
color: $biomes/colors.yml:SAVANNA

vanilla: minecraft:savanna

attributes:
  terra:biome/grass_color: "#b5cc47"
  terra:biome/foliage_color: "#aea42a"
  terra:biome/water_color: "#2c8b9c"
  minecraft:visual/water_fog_color: "#2c8b9c"

tags:
  - LAND_CAVES
  - ANCIENT_CAVES
  - USE_LUKEWARM_RIVER

palette:
  - GRASS_VARIATION: $meta.yml:top-y
  - << meta.yml:palette-underwater
  - << meta.yml:palette-bottom

slant:
  - threshold: 0.8
    palette:
      - GRASS_VARIATION: $meta.yml:top-y
      - << meta.yml:palette-underwater
      - << meta.yml:palette-bottom
  - threshold: 0.4
    palette:
      - TERRACOTTA_SLANT: $meta.yml:top-y
      - << meta.yml:palette-bottom

features:
  flora:
    - GRASS
    - DRY_GRASS
    - POPPY_PATCH
    - DANDELION_PATCH
  trees:
    - ACACIA_TREES
    - SPARSE_FALLEN_ACACIA_TREES
    - SPARSE_BAOBAB_TREES
    - SPARSE_FALLEN_BAOBAB_TREES