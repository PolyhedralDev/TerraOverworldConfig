id: MUDDY_COASTS
type: BIOME
extends:
  - ENVIRONMENT_LAND_MARITIME_WET
  - EQ_LAND_SHORE_BUMPY
  - CARVING_OCEAN
  - BASE
color: $biomes/colors.yml:MUDDY_COASTS

vanilla: minecraft:beach

attributes:
  terra:biome/grass_color: "#464a26"
  terra:biome/foliage_color: "#8db127"
  terra:biome/water_color: "#5b646f"
  minecraft:visual/water_fog_color: "#5b646f"

tags:
  - LAND_CAVES
  - USE_RIVER_TEMPERATE_MARSH

palette:
  - MUDDY_GRASS_DIRT: $meta.yml:top-y
  - << meta.yml:palette-underwater
  - << meta.yml:palette-bottom

slant:
  - threshold: 0.4
    palette:
      - << meta.yml:palette-slant-generic
      - << meta.yml:palette-bottom

features:
  preprocessors:
    - MUD_WATER
  flora:
    - GRASS_DRY
    - SUGAR_CANE
  processors:
    - TALL_DRY_GRASS_MUD
    - TALL_DRY_GRASS