id: ARCHIPELAGO
type: BIOME
extends:
  - ENVIRONMENT_LAND_MARITIME_WET
  - EQ_ERODED_COAST
  - CARVING_OCEAN
  - BASE
color: $biomes/colors.yml:ARCHIPELAGO

vanilla: minecraft:beach

tags:
  - LAND_CAVES
  - USE_RIVER

attributes:
  terra:biome/grass_color: "#91bd59"
  terra:biome/foliage_color: "#77ab2f"
  terra:biome/water_color: "#44aff5"
  minecraft:visual/water_fog_color: "#44aff5"

palette:
  - GRASS: $meta.yml:top-y
  - SAND: ${meta.yml:ocean-level} + 3
  - MUDDY_BEACH: $meta.yml:ocean-level
  - << meta.yml:palette-bottom

slant:
  - threshold: 0.4
    palette:
      - BLOCK:minecraft:stone: $meta.yml:top-y
      - SAND: ${meta.yml:ocean-level} + 3
      - << meta.yml:palette-bottom

features:
  flora:
    - GRASS