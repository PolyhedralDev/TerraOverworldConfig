id: MOUNTAINS
type: BIOME
extends:
  - ENVIRONMENT_LAND_CONTINENTAL_HUMID
  - EQ_LAND
  - CARVING_LAND
  - ORES_EMERALD
  - DEPOSITS_INFESTED
  - BASE
color: $biomes/colors.yml:MOUNTAINS

tags:
  - DEEP_DARK

vanilla: minecraft:windswept_hills

attributes:
  terra:biome/grass_color: "#8ab689"
  terra:biome/foliage_color: "#6da36b"
  terra:biome/water_color: "#007bf7"
  minecraft:visual/water_fog_color: "#007bf7"

palette:
  - GRASS: $meta.yml:top-y
  - << meta.yml:palette-underwater
  - << meta.yml:palette-bottom

slant:
  - threshold: 0.8
    palette:
      - GRASS: $meta.yml:top-y
      - << meta.yml:palette-underwater
      - << meta.yml:palette-bottom
  - threshold: 0.4
    palette:
      - << meta.yml:palette-slant-generic
      - << meta.yml:palette-bottom

features:
  landforms:
    - BOULDERS
    - SMALL_BOULDER_PATCHES
  flora:
    - POPPY_PATCH
    - DANDELION_PATCH
    - GRASS
    - FERNS
  trees:
    - SPRUCE_TREE_PATCHES
    - SPARSE_FALLEN_SPRUCE_TREES