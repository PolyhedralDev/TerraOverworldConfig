id: ASPEN_FOREST
type: BIOME
extends:
  - ENVIRONMENT_LAND_CONTINENTAL_MONSOON
  - EQ_MULTI_TERRACED_LAND
  - CARVING_LAND
  - BASE
color: $biomes/colors.yml:ASPEN_FOREST

tags:
  - LAND_CAVES
  - USE_RIVER

vanilla: minecraft:birch_forest

attributes:
  terra:biome/grass_color: "#8ea85e"
  terra:biome/foliage_color: "#ffdd19"
  terra:biome/water_color: "#1e97f2"
  minecraft:visual/water_fog_color: "#1e97f2"

palette:
  - GRASS: $meta.yml:top-y
  - << meta.yml:palette-underwater
  - << meta.yml:palette-bottom

slant:
  - threshold: 0.8
    palette:
      - GRASS: $meta.yml:top-y
      - << meta.yml:palette-underwater
      - << meta.yml:palette-bottom
  - threshold: 0.4
    palette:
      - CALCITE_SLANT: $meta.yml:top-y
      - << meta.yml:palette-bottom

features:
  flora:
    - GRASS
    - POPPY_PATCH
    - DANDELION_PATCH
    - ROSE_BUSH_PATCH
    - PEONY_PATCH
    - LILAC_PATCH
    - LILY_OF_THE_VALLEY_PATCH
    - PUMPKIN_PATCHES
  trees:
    - SEASONAL_TREES
    - SPARSE_FALLEN_BIRCH_TREES
    - SPARSE_SPRUCE_TREES
    - SPARSE_FALLEN_ASPEN_TREES