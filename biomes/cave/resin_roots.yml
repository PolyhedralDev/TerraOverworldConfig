id: RESIN_ROOTS
type: BIOME
extends:
  - CAVE
  - BASE
color: $biomes/colors.yml:RESIN_ROOTS

vanilla: minecraft:dripstone_caves

tags:
  - USE_RIVER_TEMPERATE_MARSH

attributes:
  minecraft:visual/fog_color: "#817770"
  terra:biome/water_color: "#76889d"
  minecraft:visual/water_fog_color: "#556980"
  minecraft:visual/sky_color: "#b9b9b9"
  terra:biome/grass_color: "#778272"
  terra:biome/foliage_color: "#878d76"
  terra:biome/has_precipitation: true
  terra:biome/temperature: 1.0
  terra:biome/downfall: 1.0
  minecraft:visual/ambient_particles:
    - particle:
        type: minecraft:infested
      probability: 0.0005

palette:
  - RESIN_ROOTS: $meta.yml:top-y
  - RESIN_ROOTS_DEEPSLATE: $meta.yml:deepslate-top
  - << meta.yml:palette-bedrock

features:
  flora:
    - GRASS_CAVES
    - PALE_MOSS_CARPET_CAVES
    - EYEBLOSSOM_PATCH_CAVES
    - PALE_HANGING_MOSS_CAVES
  landforms:
    - WEEPING_WILLOW_TREES
  trees:
    - PALE_OAK_VINES_UNDERGROUND
  postprocessors:
    - CREAKING_HEARTS_CAVES
    - GLOW_LICHEN_TENDRIL_CAVES

