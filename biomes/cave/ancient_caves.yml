id: ANCIENT_CAVES
type: BIOME
extends:
  - CAVE
  - BASE
color: $biomes/colors.yml:ANCIENT_CAVES

vanilla: minecraft:dripstone_caves

attributes:
  minecraft:visual/ambient_particles:
    - particle:
        type: minecraft:falling_dust
        block_state: minecraft:light_gray_terracotta
      probability: 0.0005

palette:
  - ANCIENT_CAVES: $meta.yml:top-y
  - ANCIENT_CAVES_DEEPSLATE: $meta.yml:deepslate-top
  - << meta.yml:palette-bedrock

features:
  flora:
    - ANCIENT_FLOWER_COVER
  preprocessors:
    - SUSPICIOUS_SAND_DEPOSITS
    - SUSPICIOUS_GRAVEL_DEPOSITS
  postprocessors:
    - TRIAL_RUIN_REMNANTS
    - SUSPICIOUS_SAND
    - SUSPICIOUS_GRAVEL
  landforms:
    - GREAT_BAOBAB_TREES
    - FOSSILS