id: DEEP_DARK
type: BIOME
extends:
  - CAVE
  - BASE
color: $biomes/colors.yml:DEEP_DARK

vanilla: minecraft:deep_dark

attributes:
  minecraft:visual/fog_color: "#000000"
  terra:biome/water_color: "#102e38"
  minecraft:visual/water_fog_color: "#171921"
  minecraft:visual/sky_color: "#1c2742"
  terra:biome/grass_color: "#163b46"
  terra:biome/foliage_color: "#195a58"
  terra:biome/has_precipitation: true
  terra:biome/temperature: 1.0
  terra:biome/downfall: 1.0

palette:
  - BLOCK:minecraft:stone: $meta.yml:top-y
  - << meta.yml:palette-bottom

features:
  preprocessors:
    - SCULK_WEBS
    - SCULK_PATCHES
    - SCULK_TENDRIL
  trees:
    - SCULK_BLOBS
  flora:
    - SCULK_FLORA