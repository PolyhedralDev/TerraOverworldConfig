id: COLD_RIVER
type: BIOME
extends:
  - RIVER_DRIPSTONE
  - ENVIRONMENT_MARINE_RIVER_COLD
  - EQ_GLOBAL_RIVER
  - CARVING_OCEAN
  - BASE
color: $biomes/colors.yml:COLD_RIVER

vanilla: minecraft:river

palette:
  - GRASS: $meta.yml:top-y
  - MUDDY_BEACH: ${meta.yml:ocean-level} + 3
  - << meta.yml:palette-bottom

slant:
  - threshold: 0.8
    palette:
      - GRASS: $meta.yml:top-y
      - MUDDY_BEACH: ${meta.yml:ocean-level} - 1
      - << meta.yml:palette-bottom
  - threshold: 0.5
    palette:
      - BLOCK:minecraft:stone: $meta.yml:top-y
      - << meta.yml:palette-bottom

attributes:
  terra:biome/grass_color: "#8ab689"
  terra:biome/foliage_color: "#6da36b"
  terra:biome/water_color: "#007bf7"
  minecraft:visual/water_fog_color: "#007bf7"

features:
  flora:
    - FERNS
    - GRASS
  landforms:
    - RIVER_BOULDERS